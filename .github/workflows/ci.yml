name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast tier: everything that runs on the build host. No qemu, no bare image,
  # so a regression is reported in minutes instead of behind an emulator run.
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm python3 make

      - name: Toolchain versions
        run: |
          clang --version | head -1
          llvm-ar --version | head -1
          python3 --version

      # CC=clang: the host tests build with -Werror=pedantic and stock cc on
      # Ubuntu is gcc, which rejects __int128 in loongbt_semantics.c.
      - name: Host unit tests
        run: make test CC=clang

      # The per-hart TB cache invariant tests are host-side and run in
      # milliseconds; they are the only coverage of the SMP invalidation
      # registry, so they must gate every push. `make check` also builds
      # test-latr-machine-trap, which needs a header this tree does not carry
      # yet, so the working targets are listed explicitly.
      - name: LATR host tests
        working-directory: latr
        run: make all test-legality test-elf test-tb-smp CLANG=clang AR=llvm-ar

  # ISA tier: build every port core and boot each bare ISA image under qemu.
  isa-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm qemu-system-misc python3 make

      - name: Toolchain versions
        run: |
          clang --version | head -1
          ld.lld --version | head -1
          qemu-system-loongarch64 --version | head -1

      # Port core archives are prerequisites of the bare ISA images but have
      # no rule in the top-level Makefile; build them first. CLANG/AR are
      # passed as command-line vars so they propagate into the $(MAKE) -C
      # port sub-makes via MAKEFLAGS.
      - name: Build LATA core
        working-directory: lata
        run: make CLANG=clang AR=llvm-ar

      - name: Build LATR core
        working-directory: latr
        run: make CLANG=clang AR=llvm-ar

      - name: Build LATM core
        working-directory: latm
        run: make CLANG=clang AR=llvm-ar

      # QLVZ_REPO default points at a checked-in macOS qemu binary; the ISA
      # gates only need a generic virt machine, which stock
      # qemu-system-loongarch64 (qemu-system-misc) provides. run_qemu_lata.sh
      # resolves bios/keymaps via `dirname $QEMU_BIN`/../share/qemu, which
      # lands on /usr/share/qemu for the distro package.
      #
      # QEMU_CPU=max: distro la464 does not decode every instruction the
      # translator emits (LSX lanes appear in generated code).
      # QEMU_DEBUG=1: print qemu's stderr, execution trace and serial byte
      # count when a gate fails, because a distro qemu can die before the
      # guest writes its first byte.
      - name: LATA ISA gate
        run: |
          make lata-isa-run \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
            QLVZ_REPO=/usr/bin/qemu-system-loongarch64
        env:
          QEMU_DEBUG: 1
          QEMU_CPU: max

      - name: LATR ISA gate
        run: |
          make latr-isa-run \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
            QLVZ_REPO=/usr/bin/qemu-system-loongarch64
        env:
          QEMU_DEBUG: 1
          QEMU_CPU: max

      - name: LATM ISA gate
        run: |
          make latm-isa-run \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
            QLVZ_REPO=/usr/bin/qemu-system-loongarch64
        env:
          QEMU_DEBUG: 1
          QEMU_CPU: max
