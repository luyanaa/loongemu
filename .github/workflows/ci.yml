name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast tier: everything that runs on the build host. No qemu, no bare image,
  # so a regression is reported in minutes instead of behind an emulator run.
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm python3 make

      - name: Toolchain versions
        run: |
          clang --version | head -1
          llvm-ar --version | head -1
          python3 --version

      # CC=clang: the host tests build with -Werror=pedantic and stock cc on
      # Ubuntu is gcc, which rejects __int128 in loongbt_semantics.c.
      - name: Host unit tests
        run: make test CC=clang

      # The per-hart TB cache invariant tests are host-side and run in
      # milliseconds; they are the only coverage of the SMP invalidation
      # registry, so they must gate every push. `make check` also builds
      # test-latr-machine-trap, which needs a header this tree does not carry
      # yet, so the working targets are listed explicitly.
      - name: LATR host tests
        working-directory: latr
        run: make all test-legality test-elf test-tb-smp CLANG=clang AR=llvm-ar

  # ISA tier: build the port cores and boot the LATR/LATM bare ISA images.
  #
  # Runner image: Debian trixie ships qemu 10, which decodes the LSX/LASX lanes
  # that LATR's RVV lowering emits and that Ubuntu 24.04's qemu 8.2 rejects with
  # "Instruction Non-Existent". QEMU_CPU=max exercises every implemented
  # feature; QEMU_DEBUG=1 makes a failing gate print qemu's stderr, the first
  # exception with 30 lines of traceback, and the serial text.
  #
  # The LATA gate is not here on purpose: LATA lowers AArch64 NZCV through the
  # LoongArch binary-translation instruction `armmtflag` (translate-a64.c:870,
  # 883, 1848, 8207, 9078; sve-lasx-lower.c; insts-pattern.c). QEMU-LVZ
  # implements LBT, every distro qemu (8.2 through 10.0) does not, so the image
  # dies on the first subs/cset block there. Run it locally with
  # `make lata-isa-run`. Giving LATA a software NZCV path for non-LBT hosts is
  # the change that would let this gate return.
  isa-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: ISA gates (qemu 10)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e QEMU_DEBUG=1 -e QEMU_CPU=max \
            debian:trixie bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                clang lld llvm qemu-system-misc make python3 ca-certificates
              qemu-system-loongarch64 --version | head -1
              make -C latr all CLANG=clang AR=llvm-ar
              make -C latm all CLANG=clang AR=llvm-ar
              make latr-isa-run \
                CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
                QLVZ_REPO=/usr/bin/qemu-system-loongarch64
              make latm-isa-run \
                CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
                QLVZ_REPO=/usr/bin/qemu-system-loongarch64
            '
