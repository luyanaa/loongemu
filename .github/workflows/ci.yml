name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: the same two tiers, so emulator- or scheduler-dependent flakes
  # (SMP invalidation, MTTCG timing, host-test races) get caught without
  # re-running everything on every push.
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

jobs:
  # The LATA gate used to be local-only: LATA kept AArch64 NZCV in the LoongArch
  # binary-translation flag register, and no distro qemu implements LBT. That is
  # no longer true - the port now has a software NZCV path over
  # env->pstate[31:28] (docs/design/lata-software-nzcv.md, P0/P1), selected with
  # LATA_FORCE_NO_LBT=1, and the job below runs the whole ISA image through it
  # under qemu-system-misc. The LBT path still exists and is what a hardware
  # host uses; it is validated locally, not here.
  #
  # What the two paths share is now measured rather than assumed: both produce
  # 6549 checks with 0 fails, and the raw-flag probes (MRS NZCV after each
  # producer, plus all 14 encodable conditions over two flag states) agree bit
  # for bit. Defects this work fixed: the unreachable ARM_CP_NZCV case (the
  # special-case mask covers 0xf while the flag is 1<<7), armmfflag's sign
  # extension of the 32-bit word, and an armmove implementation that dropped rd
  # instead of preserving it.

  # Fast tier: everything that runs on the build host. No qemu, no bare image,
  # so a regression is reported in minutes instead of behind an emulator run.
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm python3 make

      - name: Toolchain versions
        run: |
          clang --version | head -1
          llvm-ar --version | head -1
          python3 --version

      # CC=clang: the host tests build with -Werror=pedantic and stock cc on
      # Ubuntu is gcc, which rejects __int128 in loongbt_semantics.c.
      - name: Host unit tests
        run: make test CC=clang

      # Decode/legality/ELF/TB-cache-invariants/machine-trap, all host-side and
      # in milliseconds. The TB cache tests are the only coverage of the SMP
      # invalidation registry, so they must gate every push.
      - name: LATR host tests
        working-directory: latr
        run: make check CLANG=clang AR=llvm-ar

  # ISA tier: boot the LATR and LATM bare ISA images.
  #
  # Runner image: Debian trixie ships qemu 10, which decodes the LSX/LASX lanes
  # that LATR's RVV lowering emits and that Ubuntu 24.04's qemu 8.2 rejects with
  # "Instruction Non-Existent". QEMU_CPU=max exercises every implemented
  # feature; QEMU_DEBUG=1 makes a failing gate print qemu's stderr, the first
  # exception with 30 lines of traceback, and the serial text.
  #
  # qemu advertises CPUCFG.2[22] (LBT) on its `max` model but does not decode
  # `gr2scr`/`jiscr0`: the LATM chaining case dies with "Instruction
  # Non-Existent" at the first chained indirect jump on qemu 10.0.13 and
  # 11.1.3. The gate builds with LATM_FORCE_NO_LBT=1, which selects the plain
  # `jirl` fallback the translator already carries; the harness then prints
  # `chain-jiscr1 skipped (no LBT)` because that one case exists to exercise
  # the instruction itself. With LBT both chaining cases run (60 checks); under
  # the fallback 92 checks pass with 0 failures on qemu 11.1.3.
  #
  isa-latr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: LATR ISA + guest boot + PERF
        run: |
          # Script via a quoted heredoc: an apostrophe inside `bash -c '...'`
          # would terminate the string and move the rest onto the host shell.
          cat > /tmp/gate.sh <<'SCRIPT'
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            clang lld llvm qemu-system-misc make python3 ca-certificates
          # The riscv targets moved out of qemu-system-misc on some Debian
          # releases; try both names, then assert the binary the differential
          # needs actually exists instead of failing later with Error 127.
          apt-get install -y -qq --no-install-recommends qemu-system-riscv || true
          command -v qemu-system-riscv64 || {
              echo "gate: qemu-system-riscv64 is required by latr-rand-diff"; exit 1; }
          qemu-system-loongarch64 --version | head -1
          make -C latr all CLANG=clang AR=llvm-ar
          make latr-isa-run \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
            QLVZ_REPO=/usr/bin/qemu-system-loongarch64
          # End-to-end: a paged RISC-V ELF guest with MMIO and traps.
          make latr-sys-run \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
            QLVZ_REPO=/usr/bin/qemu-system-loongarch64
          # Random-instruction differential: the same seeded ALU stream on LATR
          # and on qemu-system-riscv64, compared by a register-set hash, plus
          # extra seeds so one lucky stream cannot hide a defect.
          make latr-rand-diff \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
            QLVZ_REPO=/usr/bin/qemu-system-loongarch64
          make latr-rand-sweep \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
            QLVZ_REPO=/usr/bin/qemu-system-loongarch64
          # Fault differential: load/store/instruction access faults, ecall and
          # illegal instruction, compared cause/mepc/mtval against QEMU.
          make latr-fault-diff \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
            QLVZ_REPO=/usr/bin/qemu-system-loongarch64
          # Guest-level SMP: two harts, real AMO/LR-SC/IPI/FENCE.I, real machine.
          make latr-smp-run \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
            QLVZ_REPO=/usr/bin/qemu-system-loongarch64
          # One table of every deterministic counter and the host dispatch cost,
          # so a change is comparable against the last run in the job log.
          make latr-bench \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
            QLVZ_REPO=/usr/bin/qemu-system-loongarch64
          # PERF build from a clean tree: make does not track the -DLOONGEMU_PERF
          # change and would relink stale objects.
          make -C latr clean CLANG=clang AR=llvm-ar
          make latr-sys-run PERF=1 \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
            QLVZ_REPO=/usr/bin/qemu-system-loongarch64
          grep -a 'latr-perf:' build/latr_sys_diff.log

          SCRIPT
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -v /tmp/gate.sh:/gate.sh:ro \
            -w /src -e QEMU_DEBUG=1 -e QEMU_CPU=max \
            debian:sid bash /gate.sh

  isa-latm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: LATM ISA + board
        run: |
          # Script via a quoted heredoc: an apostrophe inside `bash -c '...'`
          # would terminate the string and move the rest onto the host shell.
          cat > /tmp/gate.sh <<'SCRIPT'
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            clang lld llvm qemu-system-misc make python3 ca-certificates
          qemu-system-loongarch64 --version | head -1
          make -C latm all CLANG=clang AR=llvm-ar
          # qemu advertises CPUCFG.2[22] (LBT) but cannot decode gr2scr/jiscr0,
          # so the plain jirl chain path is what the gate exercises.
          make latm-isa-run LATM_FORCE_NO_LBT=1 \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
            QLVZ_REPO=/usr/bin/qemu-system-loongarch64
          # Board harness: FDT handoff plus the first system TB.
          make latm-board-run \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
            QLVZ_REPO=/usr/bin/qemu-system-loongarch64

          SCRIPT
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -v /tmp/gate.sh:/gate.sh:ro \
            -w /src -e QEMU_DEBUG=1 -e QEMU_CPU=max \
            debian:sid bash /gate.sh

  isa-lata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: LATA ISA (software NZCV path)
        run: |
          # Script via a quoted heredoc: an apostrophe inside `bash -c '...'`
          # would terminate the string and move the rest onto the host shell.
          cat > /tmp/gate.sh <<'SCRIPT'
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            clang lld llvm qemu-system-misc make python3 ca-certificates
          qemu-system-loongarch64 --version | head -1
          make -C lata all CLANG=clang AR=llvm-ar
          # LATA_FORCE_NO_LBT=1 keeps the image free of LBT instructions, which a
          # distro qemu does not decode; the software path is the one under test.
          # On failure the guest log is the only evidence, and the make recipe
          # only echoes its first lines, so dump the tail here.
          make lata-isa-run LATA_FORCE_NO_LBT=1 \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld \
            QLVZ_REPO=/usr/bin/qemu-system-loongarch64 || {
            tail -60 build/lata_isa.log
            exit 1
          }
          # lata-isa-run already asserts "lata-isa: PASS" (fails == 0); the
          # summary is echoed so a regression names itself in the job log.
          grep -a 'lata-isa: checks=' build/lata_isa.log

          SCRIPT
          # Same container as the LATR/LATM jobs: root for apt, a modern qemu, and
          # QEMU_CPU=max for the instructions a distro la464 model may not decode.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -v /tmp/gate.sh:/gate.sh:ro \
            -w /src -e QEMU_DEBUG=1 -e QEMU_CPU=max \
            debian:sid bash /gate.sh

  boot-smp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: LoongArch SMP boot harness
        run: |
          # Script via a quoted heredoc: an apostrophe inside `bash -c '...'`
          # would terminate the string and move the rest onto the host shell.
          cat > /tmp/gate.sh <<'SCRIPT'
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            clang lld llvm qemu-system-misc make python3 ca-certificates
          qemu-system-loongarch64 --version | head -1
          # Boot tier: a translated x86 host boots on 4 LoongArch harts with IPI
          # shootdowns, then asserts phys_cpus_online=4, `tb-sys: done` and
          # fails=0. The embedded initramfs is gitignored and generated on
          # demand; -nic none keeps qemu from needing an option ROM. It ends
          # through the rule 90s timeout by design.
          #
          # This gate failed 11 checks until the PLV0 trap stub stopped saving
          # its register frame on top of the 48-byte guest #PF frame; both
          # toolchains now report 117/0.
          make tb-sys-smp-run QLVZ=/usr/bin/qemu-system-loongarch64 \
            CLANG=clang AR=llvm-ar LD_LLD=ld.lld

          SCRIPT
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -v /tmp/gate.sh:/gate.sh:ro \
            -w /src -e QEMU_DEBUG=1 -e QEMU_CPU=max \
            debian:sid bash /gate.sh

